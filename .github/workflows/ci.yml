name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-not-a-production-secret
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MONGODB_URI: mongodb://127.0.0.1:27017/multi_salon_ci
      MONGODB_DB_NAME: multi_salon_ci
      ADMIN_EMAILS: admin@example.test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate database scripts
        run: node --check scripts/seed.mjs && node --check scripts/migrate-multi-tenant.mjs && node --check scripts/audit-booking-catalog.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
